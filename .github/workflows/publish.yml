name: Publish

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check:package
      - name: Pack release
        run: |
          mkdir -p .tmp/release
          npm pack --json --pack-destination .tmp/release > .tmp/release/pack.json
      - name: Cut immutable release tag
        run: bash scripts/cut-release-tag.sh
      - name: Publish to npm with OIDC
        run: node scripts/publish-package.mjs https://registry.npmjs.org
      - name: Publish GitHub Packages mirror
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/audit-ts.npmrc"
          export NPM_CONFIG_USERCONFIG
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPM_CONFIG_USERCONFIG"
          node scripts/publish-package.mjs https://npm.pkg.github.com
